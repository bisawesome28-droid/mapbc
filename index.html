<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stokes Hall indoor map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238c1d2f'/%3E%3Cpath d='M16 6a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z' fill='white'/%3E%3Ccircle cx='16' cy='13' r='2.6' fill='%238c1d2f'/%3E%3C/svg%3E">
<style>
:root{
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --bg:#e9edf3;--surface:#ffffff;--surface2:#f4f6fa;--fg:#0f1722;--muted:#5b6678;--line:#dde2ea;
  --accent:#8c1d2f;--accent-soft:#f8e4e8;
  --route:#0a6cff;--route-soft:#e4efff;
  --ok:#12804d;--ok-soft:#dff4e8;--warn:#9a5a06;--warn-soft:#fcefd2;
  --map:#eef1f6;--grid:#cfd6e1;--floor:#ffffff;--wall:#2c3542;--fix:#eceff3;--label-halo:rgba(255,255,255,.85);
  --c-classroom:#f7ddd7;--c-office:#faefc6;--c-service:#fadbb8;--c-it:#e7e7c4;
  --c-common:#e3eff9;--c-core:#e9ecf1;--c-conf:#f4dde9;--c-connector:#e6e9ee;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 10px 30px rgba(16,24,40,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#070a0f;--surface:#111821;--surface2:#18212c;--fg:#e8edf5;--muted:#95a2b5;--line:#243040;
    --accent:#f08a9b;--accent-soft:#3a1d26;
    --route:#4db3ff;--route-soft:#12293f;
    --ok:#5fd39b;--ok-soft:#10301f;--warn:#f2b55d;--warn-soft:#352610;
    --map:#080c12;--grid:#18202c;--floor:#121a24;--wall:#8fa3bd;--fix:#19222e;--label-halo:rgba(18,26,36,.85);
    --c-classroom:#4d2931;--c-office:#4b4421;--c-service:#58391d;--c-it:#40432a;
    --c-common:#1f3b54;--c-core:#27303b;--c-conf:#4b2b40;--c-connector:#1b222c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme=dark]{
  --bg:#070a0f;--surface:#111821;--surface2:#18212c;--fg:#e8edf5;--muted:#95a2b5;--line:#243040;
  --accent:#f08a9b;--accent-soft:#3a1d26;
  --route:#4db3ff;--route-soft:#12293f;
  --ok:#5fd39b;--ok-soft:#10301f;--warn:#f2b55d;--warn-soft:#352610;
  --map:#080c12;--grid:#18202c;--floor:#121a24;--wall:#8fa3bd;--fix:#19222e;--label-halo:rgba(18,26,36,.85);
  --c-classroom:#4d2931;--c-office:#4b4421;--c-service:#58391d;--c-it:#40432a;
  --c-common:#1f3b54;--c-core:#27303b;--c-conf:#4b2b40;--c-connector:#1b222c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.ico{display:inline-grid;place-items:center;flex:none}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Layout ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:60px;padding:0 20px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center}
.logo .ico{width:20px;height:20px}
.logo svg{fill:#fff;stroke:none}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-size:17px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.hot{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.spacer{flex:1}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{color:var(--fg);border-color:var(--muted)}
.iconbtn .ico{width:19px;height:19px}

.layout{display:grid;grid-template-columns:minmax(360px,430px) 1fr;height:calc(100vh - 60px);height:calc(100dvh - 60px)}
.side{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.stage{position:relative;padding:16px 16px 16px 0;min-height:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card h2{margin:0;font-size:17px;letter-spacing:-.01em}
.card h3{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

@media (max-width:899px){
  .layout{display:flex;flex-direction:column;height:auto;padding:12px;gap:12px}
  .side{display:contents}
  #planner{order:1}.stage{order:2}#routecard{order:3}#detail{order:4}#photo{order:5}#foot{order:6}
  .stage{padding:0;height:46vh;height:46svh;min-height:300px;max-height:480px}
  .topbar{padding:0 14px}
  .hide-sm{display:none}
}

/* ---------- Planner ---------- */
.fields{position:relative;display:grid;gap:8px;padding-left:28px}
.fields::before{content:"";position:absolute;left:7px;top:30px;bottom:30px;border-left:2px dotted var(--muted);opacity:.5}
.field{position:relative;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:8px 14px 9px;transition:border-color .15s,box-shadow .15s}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.field.need{border-color:var(--route);box-shadow:0 0 0 4px var(--route-soft)}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.field select,.field input{display:block;width:100%;border:0;background:transparent;outline:none;font-size:16px;font-weight:550;padding:3px 0 0;appearance:none;-webkit-appearance:none;text-overflow:ellipsis}
.field input::placeholder{color:var(--muted);font-weight:400}
.field .chev{position:absolute;right:12px;bottom:12px;width:16px;height:16px;color:var(--muted);pointer-events:none}
.pin{position:absolute;left:-27px;top:50%;margin-top:-8px;width:16px;height:16px}
.pin.from{border-radius:50%;border:4px solid var(--ok);background:var(--surface)}
.pin.to{background:var(--accent);border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.pin.to::after{content:"";position:absolute;inset:4.5px;border-radius:50%;background:var(--surface)}

.results{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.results:empty{display:none}
.res{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:12px;padding:8px 10px}
.res:hover,.res.active{background:var(--surface2);border-color:var(--line)}
.res .sw{width:28px;height:28px;border-radius:9px;flex:none;border:1px solid color-mix(in srgb,var(--fg) 14%,transparent)}
.res .t{flex:1;min-width:0}
.res .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .t small{color:var(--muted);font-size:12.5px}
.res kbd{font:600 11px var(--font);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;display:none}
.res.active kbd{display:block}
.noneline{color:var(--muted);font-size:14px;padding:6px 4px}
.quick{display:flex;flex-wrap:nowrap;align-items:center;gap:5px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick span{font-size:12px;color:var(--muted);flex:none}
.chip{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 9px;font-size:13px;font-weight:550}
.chip:hover{border-color:var(--muted);background:var(--surface2)}
.switch{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);cursor:pointer;position:relative}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{flex:none;width:42px;height:25px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.switch .track::after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked + .track{background:var(--route)}
.switch input:checked + .track::after{transform:translateX(17px)}
.switch input:focus-visible + .track{outline:2px solid var(--route);outline-offset:2px}
.switch .lbl b{display:block;font-weight:600;font-size:14.5px}
.switch .lbl small{color:var(--muted);font-size:12.5px}

/* ---------- Route card ---------- */
.empty{display:flex;gap:14px;align-items:flex-start}
.empty .bigico{width:44px;height:44px;border-radius:14px;background:var(--route-soft);color:var(--route);display:grid;place-items:center;flex:none}
.empty .bigico .ico{width:24px;height:24px}
.empty p{margin:3px 0 0;color:var(--muted);font-size:14px}
.hintlist{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.hintlist li{display:flex;gap:10px;align-items:center;font-size:14px}
.hintlist i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.sum{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.sum .big{font-size:38px;line-height:1;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sum .big small{font-size:16px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:3px}
.sum .dist{color:var(--muted);font-size:15px;padding-bottom:3px;font-variant-numeric:tabular-nums}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.info{background:var(--route-soft);color:var(--route);border-color:transparent}
.steps{list-style:none;margin:14px 0 0;padding:0}
.step{display:grid;grid-template-columns:34px 1fr auto;gap:12px;position:relative;padding-bottom:14px}
.step:last-child{padding-bottom:0}
.step .ico{width:34px;height:34px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);color:var(--fg);padding:7px;position:relative;z-index:1}
.step:not(:last-child)::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.step.start .ico{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.step.arrive .ico{background:var(--accent);color:#fff;border-color:transparent}
.step .txt{padding-top:6px;font-weight:550;min-width:0}
.step .tag{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:99px;background:var(--route-soft);color:var(--route);vertical-align:2px}
.step .ft{padding-top:7px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 13px;font-size:14px;font-weight:600}
.btn:hover{border-color:var(--muted);background:var(--surface2)}
.btn .ico{width:16px;height:16px}
.fine{margin:12px 0 0;color:var(--muted);font-size:12.5px;line-height:1.45}
.callout{margin-top:12px;border-radius:12px;padding:10px 12px;font-size:13.5px;background:var(--warn-soft);color:var(--warn)}

/* ---------- Details ---------- */
.dhead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.dhead .sw{width:40px;height:40px;border-radius:12px;border:1px solid color-mix(in srgb,var(--fg) 14%,transparent);flex:none}
.dhead small{display:block;color:var(--muted);font-size:12.5px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
dt{color:var(--muted)}
dd{margin:0}
dd.none{color:var(--muted)}
.photo .ph{border:1.5px dashed var(--line);border-radius:14px;padding:22px 14px;text-align:center;color:var(--muted);font-size:13.5px}
.photo img{max-width:100%;border-radius:14px;display:block}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:5px 0 12px}
.meter i{display:block;height:100%;background:var(--route);border-radius:99px}
#foot{padding:4px 4px 18px;color:var(--muted);font-size:12.5px}
#foot .row{display:flex;justify-content:space-between}

/* ---------- Map ---------- */
.mapwrap{position:relative;height:100%;border-radius:20px;overflow:hidden;background:var(--map);border:1px solid var(--line);box-shadow:var(--shadow)}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map:active{cursor:grabbing}
.glass{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.zoom{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;overflow:hidden}
.zoom button{width:40px;height:40px;border:0;background:transparent;font-size:20px;line-height:1;color:var(--fg)}
.zoom button + button{border-top:1px solid var(--line)}
.zoom button:hover{background:var(--surface2)}
.zoom .all{font-size:12px;font-weight:700}
.maptools{position:absolute;top:12px;left:12px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 76px)}
.maptools label{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.maptools input{accent-color:var(--route);margin:0}
.netkey{display:none;align-items:center;gap:12px;padding:7px 12px;font-size:12.5px;color:var(--muted)}
.netkey.on{display:flex}
.netkey i{display:inline-block;width:20px;height:0;border-top:3px solid var(--muted);vertical-align:middle;margin-right:6px}
.netkey i.g{border-top:3px dashed #e28a1c}
.zoom button .ico{width:20px;height:20px}
.zoom #locate[aria-pressed=true]{background:var(--route);color:#fff}
.floors{position:absolute;top:196px;right:12px;display:flex;flex-direction:column;overflow:hidden}
.floors button{width:40px;height:38px;border:0;background:transparent;font-size:15px;font-weight:800;color:var(--muted)}
.floors button + button{border-top:1px solid var(--line)}
.floors button:hover{background:var(--surface2);color:var(--fg)}
.floors button[aria-pressed=true]{background:var(--accent);color:#fff}
.levelbar{position:absolute;left:50%;transform:translateX(-50%);bottom:70px;max-width:calc(100% - 24px);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;padding:8px 10px;font-size:13px}
.levelbar .lbl{color:var(--muted);font-weight:600}
.levelbar .arrow{color:var(--muted)}
.levelbar button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700}
.levelbar button[aria-pressed=true]{background:var(--route);border-color:var(--route);color:#fff}
.levelbar .blanknote{flex-basis:100%;text-align:center;color:var(--warn);font-weight:600;font-size:12.5px;max-width:520px}
.levelbar .short{display:none}
@media (max-width:899px){.levelbar{bottom:62px;width:calc(100% - 24px);padding:6px 8px}.levelbar .blanknote{font-size:11.5px}.levelbar .long{display:none}.levelbar .short{display:inline}}
.golevel{display:inline-block;margin-left:8px;border:1px solid var(--route);color:var(--route);background:transparent;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700;vertical-align:1px}
.golevel:hover{background:var(--route-soft)}
.step.level .ico{background:var(--route-soft);color:var(--route);border-color:transparent}
.legend{position:absolute;left:12px;bottom:12px;right:12px;display:flex;flex-wrap:wrap;gap:6px;padding:8px}
.legend button{display:flex;align-items:center;gap:7px;border:1px solid transparent;background:transparent;border-radius:99px;padding:4px 10px 4px 6px;font-size:12.5px;font-weight:550}
.legend button:hover{background:var(--surface2)}
.legend button[aria-pressed=false]{opacity:.45;text-decoration:line-through}
.legend .sw{width:14px;height:14px;border-radius:5px;border:1px solid color-mix(in srgb,var(--fg) 20%,transparent)}
@media (max-width:899px){
  .legend{right:12px;left:12px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .legend button{white-space:nowrap}
}

/* SVG layers. Sizes are in map units (brochure pixels); --u is map units per screen pixel. */
.bgrid{fill:url(#dots)}
.dot{fill:var(--grid)}
.bwall{fill:var(--floor);stroke:var(--wall);stroke-width:12;stroke-linejoin:miter;filter:url(#lift)}
.pier{fill:var(--wall)}
.pillar{fill:var(--wall)}
.wing{font-size:30px;font-weight:800;letter-spacing:.3em;fill:var(--muted);opacity:.75;pointer-events:none}
.fix{fill:var(--fix);stroke:var(--wall);stroke-width:3}
.fixl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;fill:var(--muted);visibility:hidden;pointer-events:none}
.z-in .fixl{visibility:visible}
.room{cursor:pointer;transition:opacity .2s}
.room .shape{stroke:var(--wall);stroke-width:3;stroke-linejoin:miter;transition:stroke .15s,stroke-width .15s}
.room .part{stroke:var(--wall);stroke-width:2;opacity:.75}
.furn{pointer-events:none;opacity:.42}
.furn .row{fill:none;stroke:var(--fg);stroke-width:4.5;stroke-linecap:round}
.furn .board{stroke:var(--fg);stroke-width:4;stroke-linecap:round}
.furn .lectern{fill:var(--fg)}
.furn .table{fill:none;stroke:var(--fg);stroke-width:4}
.furn .tread{stroke:var(--fg);stroke-width:1.6}
.furn .stair-arrow{stroke:var(--fg);stroke-width:2.5}
.arrowhead{fill:var(--fg);opacity:.6}
.furn .car{fill:none;stroke:var(--fg);stroke-width:2}
.wc{fill:var(--fg);opacity:.45;pointer-events:none}
.rlabel{font-size:clamp(11px,calc(var(--u,1) * 11.5px),30px);font-weight:700;fill:var(--fg);pointer-events:none;letter-spacing:.01em;paint-order:stroke;stroke:var(--label-halo);stroke-width:calc(var(--u,1) * 3.5px);stroke-linejoin:round}
.rlabel.tiny{visibility:hidden}
.z-in .rlabel.tiny,.room.sel .rlabel.tiny{visibility:visible}
.room:hover .shape{stroke:var(--route);stroke-width:5}
.room:focus{outline:none}
.room:focus-visible .shape{stroke:var(--route);stroke-width:6}
.t-classroom .shape{fill:var(--c-classroom)}
.t-office .shape{fill:var(--c-office)}
.t-service .shape{fill:var(--c-service)}
.t-it .shape{fill:var(--c-it)}
.t-common .shape{fill:var(--c-common)}
.t-core .shape{fill:var(--c-core)}
.t-conf .shape{fill:var(--c-conf)}
.t-connector .shape{fill:var(--c-connector);stroke-dasharray:14 8;stroke-width:2.5}
.room.fade{opacity:.5}
.room.dim{opacity:.12}
.room.match .shape{stroke:var(--accent);stroke-width:6}
.room.sel .shape{stroke:var(--accent);stroke-width:8;filter:drop-shadow(0 0 14px var(--accent));animation:glow 1.8s ease-in-out infinite}
.room.sel .furn{opacity:.6}
@keyframes glow{50%{stroke-opacity:.45}}
.doors{pointer-events:none}
.bwall.guess{stroke-dasharray:26 14;stroke-opacity:.5}
.lvchg rect{fill:var(--route);stroke:var(--surface);stroke-width:2}
.lvchg text{font-size:12px;font-weight:800;fill:#fff}
.lvchg path{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lvchg circle{fill:var(--route);stroke:var(--surface);stroke-width:2.5}
.net-link{fill:none;stroke:var(--route);stroke-width:calc(var(--u,1) * 2.5)}
.door-gap{stroke:var(--floor);stroke-width:7}
.door-leaf{stroke:var(--wall);stroke-width:2.5}
.door-arc{fill:none;stroke:var(--wall);stroke-width:1.5;stroke-dasharray:4 3;opacity:.8}
.entry-gap{stroke:var(--floor);stroke-width:16}

.mk{transform:scale(var(--u,1))}
.spot{cursor:pointer}
.spot circle{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}
.spot text{font-size:7.5px;font-weight:800;fill:var(--accent);pointer-events:none}
.spot.sel circle{stroke-width:3}
.spot:focus{outline:none}
.spot:focus-visible circle{stroke:var(--route);stroke-width:3}

.entrance{cursor:pointer}
.entrance .edot{fill:var(--ok);stroke:var(--surface);stroke-width:2.5}
.entrance .eico{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.entrance .ering{fill:none;stroke:var(--ok);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.entrance .etag{visibility:hidden;pointer-events:none}
.entrance .etag rect{fill:var(--ok);}
.entrance .etag text{font-size:10.5px;font-weight:700;fill:#fff}
.z-in .entrance .etag,.entrance:hover .etag,.entrance:focus-visible .etag,.entrance.on .etag{visibility:visible}
.entrance.on .edot{stroke:var(--fg);stroke-width:3}
.entrance.on .ering{opacity:1;animation:ping 2s ease-out infinite}
.entrance:focus{outline:none}
.entrance:focus-visible .edot{stroke:var(--route)}
@keyframes ping{0%{transform:scale(.8);opacity:.9}100%{transform:scale(2.1);opacity:0}}

.route-casing{fill:none;stroke:var(--map);stroke-width:calc(var(--u,1) * 10);stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.route-line{fill:none;stroke:var(--route);stroke-width:calc(var(--u,1) * 5);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.3,.7,.2,1) forwards;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--route) 60%,transparent))}
.route-flow{fill:none;stroke:#fff;stroke-opacity:.8;stroke-width:calc(var(--u,1) * 1.8);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:calc(var(--u,1) * 1) calc(var(--u,1) * 13);opacity:0;animation:fadein .3s 1s forwards,flow 1.1s 1s linear infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
@keyframes flow{to{stroke-dashoffset:calc(var(--u,1) * -14)}}
.route-end-ring{fill:var(--route);opacity:.3;transform-box:fill-box;transform-origin:center;animation:ping2 2s ease-out infinite}
.route-end{fill:var(--route);stroke:#fff;stroke-width:3}
.route-end-dot{fill:#fff}
@keyframes ping2{0%{transform:scale(.7);opacity:.5}100%{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .route-line{animation:none;stroke-dashoffset:0}
  .route-flow,.route-end-ring,.entrance.on .ering,.room.sel rect{animation:none}
  .route-flow{display:none}
}
.net-edge{stroke:var(--muted);stroke-width:calc(var(--u,1) * 2.5);fill:none;stroke-linecap:round}
.net-edge.guess{stroke:#e28a1c;stroke-dasharray:calc(var(--u,1) * 7) calc(var(--u,1) * 5)}
.net-node{fill:var(--muted)}
.net-node.guess{fill:#e28a1c}
.net-attach{stroke:var(--muted);stroke-width:calc(var(--u,1) * 1.2);stroke-dasharray:calc(var(--u,1) * 2) calc(var(--u,1) * 2)}
.net-door{fill:var(--surface);stroke:var(--muted);stroke-width:calc(var(--u,1) * 1.5)}
#layer-net,#layer-route,#layer-you{pointer-events:none}

/* Blue dot: the ring is the real GPS error in map units, the dot stays the same size on screen. */
.you-acc{fill:var(--route);fill-opacity:.14;stroke:var(--route);stroke-opacity:.4;stroke-width:calc(var(--u,1) * 1.2)}
.you-ring{fill:var(--route);opacity:.3;transform-box:fill-box;transform-origin:center;animation:ping2 2s ease-out infinite}
.you-dot{fill:var(--route);stroke:#fff;stroke-width:3;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
@media (prefers-reduced-motion:reduce){.you-ring{animation:none;display:none}}
.locbar{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--route-soft);font-size:13.5px}
.locbar[hidden]{display:none}
.locbar.warn{background:var(--warn-soft);color:var(--warn)}
.locbar .msg{flex:1 1 200px}
.locbar .btn{padding:4px 11px;font-size:13px}

<body>

<header class="topbar">
  <div class="logo"><span class="ico" id="logoico"></span></div>
  <div class="brand"><b id="title">Stokes Hall</b><span>Indoor map</span></div>
  <span class="pill" id="level"></span>
  <span class="spacer"></span>
  <span class="pill hot hide-sm">Proof of concept</span>
  <button class="iconbtn" id="theme" aria-label="Switch between light and dark"><span class="ico" id="themeico"></span></button>
</header>

<div class="layout">
  <aside class="side">
    <section class="card" id="planner" aria-label="Plan a route">
      <div class="fields">
        <div class="field" id="fromfield">
          <span class="pin from"></span>
          <label for="from">I'm entering from</label>
          <select id="from"><option value="">Choose an entrance</option></select>
          <span class="chev ico" id="chev"></span>
        </div>
        <div class="field">
          <span class="pin to"></span>
          <label for="q">Going to</label>
          <input id="q" type="search" placeholder="Room number, name, or something like restrooms" autocomplete="off" spellcheck="false" enterkeyhint="search">
        </div>
      </div>
      <div class="results" id="results" role="listbox" aria-label="Search results" aria-live="polite"></div>
      <div class="quick" id="quick"><span>Nearest</span></div>
      <div class="locbar" id="locbar" hidden aria-live="polite"></div>
      <label class="switch">
        <input type="checkbox" id="accessible">
        <span class="track"></span>
        <span class="lbl"><b>Step-free route</b><small>Avoids stairs and steps</small></span>
      </label>
    </section>

    <section class="card" id="routecard" aria-live="polite"></section>
    <section class="card" id="detail" aria-live="polite"></section>
    <section class="card photo" id="photo" aria-live="polite"></section>
    <div id="foot"></div>
  </aside>

  <main class="stage">
    <div class="mapwrap">
      <svg id="map" role="group" aria-label="Floor plan. Drag to pan, scroll or pinch to zoom."></svg>
      <div class="maptools">
        <label class="glass"><input type="checkbox" id="shownet"> Show path network</label>
        <div class="glass netkey" id="netkey"><span><i></i>Traced</span><span><i class="g"></i>Guessed</span></div>
      </div>
      <div class="zoom glass">
        <button id="locate" type="button" aria-pressed="false" aria-label="Show my location" title="Show my location"><span class="ico" id="locico"></span></button>
        <button id="zin" aria-label="Zoom in">+</button>
        <button id="zout" aria-label="Zoom out">&minus;</button>
        <button id="zreset" class="all" aria-label="Show the whole floor">All</button>
      </div>
      <div class="floors glass" id="floors" role="group" aria-label="Choose a floor"></div>
      <div class="levelbar glass" id="levelbar" aria-live="polite"></div>
      <div class="legend glass" id="legend" role="group" aria-label="Show or hide room types"></div>
    </div>
  </main>
</div>

<script src="data.js"></script>
<script src="logic.js"></script>
<script>
(function () {

  var STEP_EDGES = PATHS.edges.filter(function (e) { return e.kind === 'steps' || e.kind === 'stair'; }).length;

  var TYPES = {
    classroom: 'Classroom', office: 'Offices', service: 'Service center', it: 'IT suite',

  var LEGEND = ['classroom', 'office', 'service', 'it', 'common', 'conf', 'core'];
  var QUICK = [['Restrooms', 'restrooms'], ['Elevators', 'elevators'], ['Cafe', 'cafe'], ['Advising', 'advising']];

    left: '<path d="M18 20v-8a4 4 0 0 0-4-4H6M10 4 6 8l4 4"/>',
    right: '<path d="M6 20v-8a4 4 0 0 1 4-4h8M14 4l4 4-4 4"/>',
    'sharp-left': '<path d="M18 20V10a4 4 0 0 0-4-4H7M10 2 6 6l4 4"/>',
    'sharp-right': '<path d="M6 20V10a4 4 0 0 1 4-4h7M14 2l4 4-4 4"/>',
    around: '<path d="M7 20V9a4 4 0 0 1 8 0v8M11 13l4 4 4-4"/>',
    start: '<circle cx="12" cy="12" r="4.5"/>',
    up: '<path d="M4 20h5v-5h5v-5h6"/><path d="M14 4h6v6M20 4l-7 7"/>',
    down: '<path d="M4 20h5v-5h5v-5h6"/><path d="M13 5v6h6M13 11l7-7"/>',
    arrive: '<path d="M6 21V4M6 4h12l-2.5 4.5L18 13H6"/>',
    route: '<circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h5.5"/>',
    link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
    pin: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/>',
    moon: '<path d="M20.500 14.500A8.500 8.500 0 0 1 9.500 3.500a8.500 8.500 0 1 0 11 11z"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.900 4.900l1.400 1.400M17.700 17.700l1.400 1.400M4.900 19.100l1.400-1.400M17.700 6.300l1.400-1.400"/>',
    chev: '<path d="m6 9 6 6 6-6"/>',
    crosshair: '<circle cx="12" cy="12" r="3.500"/><path d="M12 2.500v4M12 17.500v4M2.500 12h4M17.500 12h4"/>'
  };
  function icon(name, cls) {

  }
  function fillIcon(id, name) { var t = document.getElementById(id); t.textContent = ''; t.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>'; }

  var $ = function (id) { return document.getElementById(id); };
  var svg = $('map'), input = $('q');
  var sel = null, hidden = {}, query = '', moved = false, from = '', accessible = false;
  var route = null, dirs = null, viaQuick = '', active = -1, shown = [];
  var roomEls = {}, spotEls = {}, entrEls = {};
  var layerNet, layerRoute, layerYou;
  var you = null, locOn = false, watchId = null, smoother = null, locNote = null, centered = false;
  var geo = ML.fitGeo((window.GEO || {}).points);
  var SIM = readUrl().sim === '1'; // ?sim=1: tap the map to place a pretend location (no GPS needed)
  var view = { cx: FULL.x + FULL.w / 2, cy: FULL.y + FULL.h / 2, w: FULL.w };
  var anim = 0;

  function h(tag, attrs, kids) {
    var e = document.createElement(tag);
    for (var k in (attrs || {})) {
      if (k === 'class') { e.className = attrs[k]; } else if (k === 'text') { e.textContent = attrs[k]; } else { e.setAttribute(k, attrs[k]); }
    }

    return e;
  }
  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) { e.setAttribute(k, attrs[k]); }
    if (parent) { parent.appendChild(e); }
    return e;
  }
  function swatch(type, cls) { var s = h('span', { 'class': cls || 'sw' }); s.style.background = 'var(--c-' + type + ')'; return s; }

  function labelFor(r) { return r.door ? r.door : (r.label || r.id); }
  function roomTitle(r) { return r.door ? r.door + ' (' + r.name + ')' : r.name; }
  function titleOf(m) { return m.kind === 'room' ? roomTitle(m.o) : m.o.label; }
  function entranceById(id) {
    for (var i = 0; i < ENTRANCES.length; i++) { if (ENTRANCES[i].id === id) { return ENTRANCES[i]; } }
    return null;
  }

  // ---------- Header ----------
  $('title').textContent = B.name;
  $('level').textContent = B.level;
  fillIcon('logoico', 'pin'); fillIcon('chev', 'chev'); fillIcon('locico', 'crosshair');

  // ---------- Map drawing ----------
  // The plan is drawn like an architect's floor plan: outside walls with buttresses, rooms with
  // thin walls, door swings, stair treads, elevator cars, restroom symbols and seating rows.
  // Seating, stairs and so on are drawn from simple rules. They show what kind of room it is,
  // not the exact furniture.
  var OUTLINES = window.OUTLINES || [], FIXTURES = window.FIXTURES || [], PILLARS = window.PILLARS || [];
  // Floors. Each floor is drawn into its own group and only the current one is shown.
  var LEVELS = window.LEVELS || [{ id: '1', name: B.level }];
  var curLevel = LEVELS[0].id, base = {}, marks = {}, doorLayers = {};
  function lv(o) { return String(o.level == null ? '1' : o.level); }
  function levelById(id) { for (var i = 0; i < LEVELS.length; i++) { if (LEVELS[i].id === id) { return LEVELS[i]; } } return null; }
  function levelName(id) { var L = levelById(id); return L ? L.name : 'Level ' + id; }
  var LEVEL_NAMES = {};
  LEVELS.forEach(function (L) { LEVEL_NAMES[L.id] = L.name; });

  function boxOf(pts) {
    var b = [Infinity, Infinity, -Infinity, -Infinity];
    pts.forEach(function (p) { b[0] = Math.min(b[0], p[0]); b[1] = Math.min(b[1], p[1]); b[2] = Math.max(b[2], p[0]); b[3] = Math.max(b[3], p[1]); });
    return { x: b[0], y: b[1], w: b[2] - b[0], h: b[3] - b[1] };
  }
  function ptsAttr(pts) { return pts.map(function (p) { return p[0] + ',' + p[1]; }).join(' '); }
  ROOMS.forEach(function (r) { r._box = boxOf(r.shape || [[r.x, r.y], [r.x + r.w, r.y + r.h]]); if (!r.shape) { r.shape = [[r.x, r.y], [r.x + r.w, r.y], [r.x + r.w, r.y + r.h], [r.x, r.y + r.h]]; } });

  // Closest wall of a polygon to a point: returns the foot point, wall direction and inward normal.
  function nearestWall(poly, p) {
    var best = null, cx = 0, cy = 0;
    poly.forEach(function (q) { cx += q[0] / poly.length; cy += q[1] / poly.length; });
    for (var i = 0; i < poly.length; i++) {
      var a = poly[i], b = poly[(i + 1) % poly.length];
      var dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
      if (!len) { continue; }
      var t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (len * len)));
      var fx = a[0] + t * dx, fy = a[1] + t * dy, d = Math.hypot(p[0] - fx, p[1] - fy);

        if ((cx - fx) * nx + (cy - fy) * ny < 0) { nx = -nx; ny = -ny; }
        best = { d: d, x: fx, y: fy, ux: ux, uy: uy, nx: nx, ny: ny };

  // A door: a gap in the wall, the door leaf, and its swing arc into the room.
  function drawDoor(parent, poly, p, width) {
    var w = nearestWall(poly, p);
    if (!w || w.d > 3) { return; }

    var tip = [h[0] + w.nx * width, h[1] + w.ny * width];
    var cross = (tip[0] - h[0]) * (e[1] - h[1]) - (tip[1] - h[1]) * (e[0] - h[0]);

    el('line', { 'class': 'door-leaf', x1: h[0], y1: h[1], x2: tip[0], y2: tip[1] }, parent);
    el('path', { 'class': 'door-arc', d: 'M' + tip[0] + ' ' + tip[1] + ' A' + width + ' ' + width + ' 0 0 ' + (cross > 0 ? 1 : 0) + ' ' + e[0] + ' ' + e[1] }, parent);
  }

  // Buttresses: small stone piers sticking out of the long outside walls.
  function drawPiers(parent, poly) {
    var area = 0;
    for (var i = 0; i < poly.length; i++) { var a = poly[i], b = poly[(i + 1) % poly.length]; area += a[0] * b[1] - b[0] * a[1]; }

      var ux = dx / len, uy = dy / len, nx = area > 0 ? uy : -uy, ny = area > 0 ? -ux : ux;

      for (var j = 0; j <= n; j++) {

        var pts = [[cx - ux * 10, cy - uy * 10], [cx + ux * 10, cy + uy * 10], [cx + ux * 8 + nx * 13, cy + uy * 8 + ny * 13], [cx - ux * 8 + nx * 13, cy - uy * 8 + ny * 13]];
        el('polygon', { 'class': 'pier', points: ptsAttr(pts) }, parent);
      }
    }
  }

  // Which side of the room the (first) door is on. The front of a classroom is the far side.
  function doorSide(r) {
    var b = r._box, d = r.doors[0];
    var sides = { top: Math.abs(d[1] - b.y), bottom: Math.abs(d[1] - (b.y + b.h)), left: Math.abs(d[0] - b.x), right: Math.abs(d[0] - (b.x + b.w)) };
    return Object.keys(sides).sort(function (a, c) { return sides[a] - sides[c]; })[0];
  }

  function drawSeating(g, r) {
    var b = r._box, side = doorSide(r);
    var vertical = side === 'top' || side === 'bottom'; // rows run left-right when the door is top or bottom
    // Local frame: "across" runs along the rows, "depth" runs from the front wall to the back wall.
    var a0 = vertical ? b.x : b.y, a1 = vertical ? b.x + b.w : b.y + b.h;
    var front = { top: b.y + b.h, bottom: b.y, left: b.x + b.w, right: b.x }[side];

    var dir = back > front ? 1 : -1, depth = Math.abs(back - front);
    var P = function (across, d) { var v = front + dir * d; return vertical ? [across, v] : [v, across]; };
    var span = a1 - a0, m = span * 0.13, mid = (a0 + a1) / 2;
    var fg = el('g', { 'class': 'furn' }, g);
    // Teaching wall: a board on the front wall and a small desk.
    var b0 = P(mid - span * 0.22, 7), b1 = P(mid + span * 0.22, 7);
    el('line', { 'class': 'board', x1: b0[0], y1: b0[1], x2: b1[0], y2: b1[1] }, fg);
    if (r.seating === 'table') {
      var t0 = P(a0 + span * 0.24, depth * 0.3), t1 = P(a1 - span * 0.24, depth * 0.78);
      var tx = Math.min(t0[0], t1[0]), ty = Math.min(t0[1], t1[1]);
      el('rect', { 'class': 'table', x: tx, y: ty, width: Math.abs(t1[0] - t0[0]), height: Math.abs(t1[1] - t0[1]), rx: 10 }, fg);
      return;
    }
    var desk = P(mid, depth * 0.16);
    el('circle', { 'class': 'lectern', cx: desk[0], cy: desk[1], r: 6 }, fg);
    var start = depth * 0.3, stop = depth * 0.9, gap = 24, rows = Math.max(2, Math.floor((stop - start) / gap));
    for (var i = 0; i <= rows; i++) {
      var dd = start + (stop - start) * i / rows;
      if (r.seating === 'tiered') {
        var bow = 10 + i * 1.5;
        var s0 = P(a0 + m, dd - bow), c = P(mid, dd + bow), s1 = P(a1 - m, dd - bow);
        el('path', { 'class': 'row', d: 'M' + s0[0] + ' ' + s0[1] + ' Q' + c[0] + ' ' + c[1] + ' ' + s1[0] + ' ' + s1[1] }, fg);
      } else {
        var aisle = span * 0.06, l0 = P(a0 + m, dd), l1 = P(mid - aisle, dd), r0 = P(mid + aisle, dd), r1 = P(a1 - m, dd);
        el('line', { 'class': 'row', x1: l0[0], y1: l0[1], x2: l1[0], y2: l1[1] }, fg);
        el('line', { 'class': 'row', x1: r0[0], y1: r0[1], x2: r1[0], y2: r1[1] }, fg);
      }
    }
  }

  function drawStair(g, r) {
    var b = r._box, fg = el('g', { 'class': 'furn' }, g), long = b.w > b.h;
    var n = Math.floor((long ? b.w : b.h) * 0.8 / 11);

    });
  }

  function drawRestroomIcon(g, r) {
    var b = r._box, cx = b.x + b.w / 2, cy = b.y + b.h / 2 + 26, fg = el('g', { 'class': 'wc', transform: 'translate(' + cx + ' ' + cy + ')' }, g);

  function draw() {
    var defs = el('defs', {}, svg);
    var pat = el('pattern', { id: 'dots', width: 48, height: 48, patternUnits: 'userSpaceOnUse' }, defs);
    el('circle', { 'class': 'dot', cx: 2, cy: 2, r: 2 }, pat);
    var f = el('filter', { id: 'lift', x: '-5%', y: '-5%', width: '110%', height: '115%' }, defs);
    el('feDropShadow', { dx: 0, dy: 10, stdDeviation: 14, 'flood-color': '#000', 'flood-opacity': 0.16 }, f);
    var mk = el('marker', { id: 'arrow', viewBox: '0 0 10 10', refX: 6, refY: 5, markerWidth: 5, markerHeight: 5, orient: 'auto-start-reverse' }, defs);
    el('path', { d: 'M0 0L10 5L0 10z', 'class': 'arrowhead' }, mk);
    el('rect', { x: -1500, y: -1500, width: 6000, height: 5000, 'class': 'bgrid' }, svg);
    LEVELS.forEach(function (L) { base[L.id] = el('g', { 'class': 'lvl', 'data-level': L.id }, svg); });

    // Outside walls, buttresses and the building floor, one floor at a time.
    LEVELS.forEach(function (L) {

      mine.forEach(function (o) { if (o.wing !== 'Bridge') { drawPiers(shell, o.points); } });
      mine.forEach(function (o) { el('polygon', { 'class': 'bwall' + (o.guess ? ' guess' : ''), points: ptsAttr(o.points) }, shell); });
      mine.forEach(function (o) {
        var b = boxOf(o.points);
        if (o.wing === 'South') { el('text', { x: b.x, y: b.y + 225, 'class': 'wing' }, base[L.id]).textContent = 'SOUTH WING'; }

      });

    FIXTURES.forEach(function (fx) {
      el('polygon', { 'class': 'fix', points: ptsAttr(fx.shape) }, base[lv(fx)]);
      var b = boxOf(fx.shape);
      el('text', { 'class': 'fixl', x: b.x + b.w / 2, y: b.y + b.h / 2 + 4, 'text-anchor': 'middle' }, base[lv(fx)]).textContent = fx.label;
    });

      el('polygon', { 'class': 'shape', points: ptsAttr(r.shape) }, g);
      (r.partitions || []).forEach(function (p) { el('line', { 'class': 'part', x1: p[0], y1: p[1], x2: p[2], y2: p[3] }, g); });
      if (r.seating) { drawSeating(g, r); }
      if (r.stair) { drawStair(g, r); }
      if (r.cars) { drawCars(g, r); }
      if (r.restroom) { drawRestroomIcon(g, r); }
      var lines = String(labelFor(r)).split('\n');
      var cx = r._box.x + r._box.w / 2, cy = r._box.y + r._box.h / 2 - (r.restroom ? 14 : 0);
      var t = el('text', { 'class': 'rlabel', x: cx, y: cy, 'text-anchor': 'middle', 'dominant-baseline': 'central' }, g);
      lines.forEach(function (ln, i) { el('tspan', { x: cx, dy: i ? '1.15em' : (-(lines.length - 1) * 0.575) + 'em' }, t).textContent = ln; });
      // Labels of very small rooms only show when zoomed in (or when the room is selected).
      if (r._box.w < 70 || r._box.h < 45) { t.classList.add('tiny'); }
      el('title', {}, g).textContent = r.name;
      roomEls[r.id] = g;
    });

    // Doors on top of every wall, so a neighbour's wall never covers a door gap.
    LEVELS.forEach(function (L) { doorLayers[L.id] = el('g', { 'class': 'doors', 'aria-hidden': 'true' }, base[L.id]); });
    ROOMS.forEach(function (r) { (r.doors || []).forEach(function (d) { drawDoor(doorLayers[lv(r)], r.shape, d, 22); }); });
    // Entrance doorways: a gap in the outside wall of the entrance's own floor.
    ENTRANCES.forEach(function (en) {
      var best = null;
      OUTLINES.forEach(function (o) {
        if (lv(o) !== lv(en)) { return; }
        var w = nearestWall(o.points, [en.x, en.y]); if (w && (!best || w.d < best.d)) { best = w; }
      });
      if (best && best.d < 40) {
        el('line', { 'class': 'entry-gap', x1: best.x - best.ux * 20, y1: best.y - best.uy * 20, x2: best.x + best.ux * 20, y2: best.y + best.uy * 20 }, doorLayers[lv(en)]);
      }
    });
    PILLARS.forEach(function (p) { el('rect', { 'class': 'pillar', x: p[0] - 10, y: p[1] - 10, width: 20, height: 20, rx: 3 }, base[LEVELS[0].id]); });

    layerNet = el('g', { id: 'layer-net', 'aria-hidden': 'true' }, svg);
    layerRoute = el('g', { id: 'layer-route', 'aria-hidden': 'true' }, svg);
    LEVELS.forEach(function (L) { marks[L.id] = el('g', { 'class': 'lvl', 'data-level': L.id }, svg); });

    SPOTS.forEach(function (s) {
      var g = el('g', { 'class': 'spot', 'data-spot': s.id, tabindex: 0, role: 'button', 'aria-label': s.label + ', photo point', transform: 'translate(' + s.x + ' ' + s.y + ')' }, marks[lv(s)]);
      var mk = el('g', { 'class': 'mk' }, g);
      el('circle', { cx: 0, cy: 0, r: 9.5 }, mk);
      el('text', { x: 0, y: 2.8, 'text-anchor': 'middle' }, mk).textContent = '360';
      el('title', {}, g).textContent = s.label;
      spotEls[s.id] = g;
    });

    ENTRANCES.forEach(function (en) {
      var g = el('g', { 'class': 'entrance', 'data-entr': en.id, tabindex: 0, role: 'button', 'aria-label': 'Entrance: ' + en.name, transform: 'translate(' + en.x + ' ' + en.y + ')' }, marks[lv(en)]);
      var mk = el('g', { 'class': 'mk' }, g);
      el('circle', { 'class': 'ering', cx: 0, cy: 0, r: 11 }, mk);
      el('circle', { cx: 0, cy: 0, r: 15, fill: 'transparent' }, mk);
      el('circle', { 'class': 'edot', cx: 0, cy: 0, r: 10.5 }, mk);
      el('path', { 'class': 'eico', d: 'M-5.500 0h8M-0.500 -3.500l3.500 3.500-3.500 3.500M4 -5.500v11' }, mk);
      // The name tag sits below the dot (above it near the bottom edge) and leans away from the map edges.
      var tw = en.name.length * 6 + 18;
      var tx = en.x > FULL.x + FULL.w * 0.85 ? -tw + 14 : (en.x < FULL.x + FULL.w * 0.15 ? -14 : -tw / 2);
      var ty = en.y > 650 ? -34 : 17;
      var tag = el('g', { 'class': 'etag' }, mk);
      el('rect', { x: tx, y: ty, width: tw, height: 20, rx: 10 }, tag);
      el('text', { x: tx + tw / 2, y: ty + 13.800, 'text-anchor': 'middle' }, tag).textContent = en.name;
      el('title', {}, g).textContent = 'Entrance: ' + en.name + (en.guess ? ' (position not checked on site yet)' : '');
      entrEls[en.id] = g;
    });

    layerYou = el('g', { id: 'layer-you', 'aria-hidden': 'true' }, svg); // on top of everything
  }

  // Draws the hallway lines of the floor on screen. Stairs and elevators that lead to another
  // floor get a ring, so you can see where the floors are linked.
  function drawNetwork() {
    layerNet.textContent = '';
    if (!$('shownet').checked) { return; }
    var nodeById = {}, linked = {};
    PATHS.nodes.forEach(function (n) { nodeById[n.id] = n; });
    graph.attach.forEach(function (a) {
      if (a.level === curLevel) { el('line', { 'class': 'net-attach', x1: a.from.x, y1: a.from.y, x2: a.to.x, y2: a.to.y }, layerNet); }
    });
    PATHS.edges.forEach(function (e) {
      var a = nodeById[e.from], b = nodeById[e.to];
      if (!a || !b) { return; }
      if (lv(a) !== lv(b)) { linked[lv(a) === curLevel ? a.id : b.id] = e.kind; return; }
      if (lv(a) === curLevel) { el('line', { 'class': 'net-edge' + (e.guess ? ' guess' : ''), x1: a.x, y1: a.y, x2: b.x, y2: b.y }, layerNet); }
    });
    PATHS.nodes.forEach(function (n) {
      if (lv(n) !== curLevel) { return; }
      if (linked[n.id]) { el('circle', { 'class': 'net-link', cx: n.x, cy: n.y, r: 16 }, layerNet); }
      var c = el('circle', { 'class': 'net-node' + (n.guess ? ' guess' : ''), cx: n.x, cy: n.y, r: 7 }, layerNet);
      el('title', {}, c).textContent = n.id + ': ' + (n.name || '') + (linked[n.id] ? ' (' + linked[n.id] + ' to another level)' : '');
    });
    ROOMS.forEach(function (r) {
      if (lv(r) !== curLevel) { return; }
      (r.doors || []).forEach(function (d) { el('circle', { 'class': 'net-door', cx: d[0], cy: d[1], r: 6 }, layerNet); });
    });
  }

  // Draws the part of the route that is on the floor on screen. Where the route changes floor,
  // a tag says "Up to Level 2" (or "From Level 1" on the other floor).
  function drawRoute() {
    layerRoute.textContent = '';
    if (!route) { return; }
    var runs = [], run = null;
    route.points.forEach(function (p, i) {
      var L = route.levels[i];
      if (!run || run.level !== L) { run = { level: L, pts: [] }; runs.push(run); }
      run.pts.push(p);
    });
    runs.forEach(function (r) {
      if (r.level !== curLevel || r.pts.length < 2) { return; }
      var pts = r.pts.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
      el('polyline', { 'class': 'route-casing', points: pts }, layerRoute);
      el('polyline', { 'class': 'route-line', points: pts, pathLength: 1 }, layerRoute);
      el('polyline', { 'class': 'route-flow', points: pts }, layerRoute);
    });
    for (var i = 1; i < route.points.length; i++) {
      var a = route.levels[i - 1], b = route.levels[i];
      if (a === b) { continue; }
      var up = parseFloat(b) > parseFloat(a), here = a === curLevel ? a : (b === curLevel ? b : null);
      if (!here) { continue; }
      var label = here === a ? (up ? 'Up to ' : 'Down to ') + levelName(b) : 'From ' + levelName(a);
      var tg = el('g', { transform: 'translate(' + route.points[i][0] + ' ' + route.points[i][1] + ')' }, layerRoute);
      var tm = el('g', { 'class': 'mk lvchg' }, tg);
      var tw = label.length * 6.4 + 34;
      el('rect', { x: -tw / 2, y: -40, width: tw, height: 24, rx: 12 }, tm);
      el('path', { d: up === (here === a) ? 'M-' + (tw / 2 - 14) + ' -24l5 -6 5 6' : 'M-' + (tw / 2 - 14) + ' -31l5 6 5 -6' }, tm);
      el('text', { x: 8, y: -24, 'text-anchor': 'middle' }, tm).textContent = label;
      el('circle', { r: 6 }, tm);
    }
    if (route.levels[route.levels.length - 1] !== curLevel) { return; }
    var end = route.points[route.points.length - 1];
    var eg = el('g', { transform: 'translate(' + end[0] + ' ' + end[1] + ')' }, layerRoute);
    var mk = el('g', { 'class': 'mk' }, eg);
    el('circle', { 'class': 'route-end-ring', cx: 0, cy: 0, r: 8 }, mk);
    el('circle', { 'class': 'route-end', cx: 0, cy: 0, r: 7.5 }, mk);
    el('circle', { 'class': 'route-end-dot', cx: 0, cy: 0, r: 2.6 }, mk);
  }

  // ---------- View: pan, zoom, animated framing ----------
  function ratio() { var w = svg.clientWidth, hh = svg.clientHeight; return (w && hh) ? hh / w : FULL.h / FULL.w; }
  function allW() { return Math.max(FULL.w, FULL.h / ratio()); }
  function clampView(v) {
    v.w = Math.max(300, Math.min(allW() * 1.05, v.w));
    v.cx = Math.max(FULL.x, Math.min(FULL.x + FULL.w, v.cx));
    v.cy = Math.max(FULL.y, Math.min(FULL.y + FULL.h, v.cy));
    return v;
  }
  function applyView() {
    var w = view.w, hh = w * ratio();
    svg.setAttribute('viewBox', (view.cx - w / 2) + ' ' + (view.cy - hh / 2) + ' ' + w + ' ' + hh);
    svg.classList.toggle('z-in', w < 1300);
    // Units per screen pixel. Markers and the route line use it to stay the same size on screen.
    if (svg.clientWidth) { svg.style.setProperty('--u', (w / svg.clientWidth).toFixed(4)); }
  }
  function goTo(t, animate) {
    cancelAnimationFrame(anim);
    t = clampView(t);
    if (!animate || REDUCED) { view = t; applyView(); return; }
    var s = { cx: view.cx, cy: view.cy, w: view.w }, t0 = performance.now(), dur = 600;
    (function step(now) {
      var k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      view = { cx: s.cx + (t.cx - s.cx) * e, cy: s.cy + (t.cy - s.cy) * e, w: s.w + (t.w - s.w) * e };
      applyView();
      if (k < 1) { anim = requestAnimationFrame(step); }
    })(t0);
  }
  function showAll(animate) { goTo({ cx: FULL.x + FULL.w / 2, cy: FULL.y + FULL.h / 2, w: allW() }, animate); }
  function zoomBy(f, px, py) {
    if (px == null) { px = view.cx; py = view.cy; }
    cancelAnimationFrame(anim);
    var nw = Math.max(300, Math.min(allW() * 1.05, view.w * f)), k = nw / view.w;
    view = clampView({ cx: px - (px - view.cx) * k, cy: py - (py - view.cy) * k, w: nw });
    applyView();
  }
  function toWorld(clientX, clientY) {
    var r = svg.getBoundingClientRect(), w = view.w, hh = w * ratio();
    return { x: view.cx - w / 2 + ((clientX - r.left) / r.width) * w, y: view.cy - hh / 2 + ((clientY - r.top) / r.height) * hh };
  }

  // Zooms to the chosen room and the whole route, or to the chosen entrance.
  function frame() {
    var b = null;
    function grow(x0, y0, x1, y1) {
      if (!b) { b = [x0, y0, x1, y1]; return; }
      b[0] = Math.min(b[0], x0); b[1] = Math.min(b[1], y0); b[2] = Math.max(b[2], x1); b[3] = Math.max(b[3], y1);
    }
    if (sel && lv(sel.o) === curLevel) {
      var o = sel.o;
      if (sel.kind === 'room') { grow(o._box.x, o._box.y, o._box.x + o._box.w, o._box.y + o._box.h); } else { grow(o.x - 50, o.y - 50, o.x + 50, o.y + 50); }
    }
    if (route) { route.points.forEach(function (p, i) { if (route.levels[i] === curLevel) { grow(p[0], p[1], p[0], p[1]); } }); }
    else if (from && lv(entranceById(from)) === curLevel) { var en = entranceById(from); grow(en.x - 150, en.y - 150, en.x + 150, en.y + 150); }
    if (!b) { return; }
    var pad = route ? 150 : 210, bw = b[2] - b[0] + pad * 2, bh = b[3] - b[1] + pad * 2;
    goTo({ cx: (b[0] + b[2]) / 2, cy: (b[1] + b[3]) / 2, w: Math.max(bw, bh / ratio(), route ? 850 : 780) }, true);
  }

  // ---------- Floors ----------
  function showLevel(id) {
    if (!levelById(id)) { return; }
    curLevel = id;
    svg.querySelectorAll('.lvl').forEach(function (g) { g.style.display = g.getAttribute('data-level') === id ? '' : 'none'; });
    $('level').textContent = levelName(id);
    $('floors').querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-level') === id ? 'true' : 'false'); });
    drawRoute(); drawNetwork(); renderBanner(); drawYou();
  }
  function goLevel(id) { showLevel(id); frame(); }

  // The bar above the legend: which floors the route uses, and a note on placeholder floors.
  function renderBanner() {
    var bar = $('levelbar');
    bar.textContent = '';
    var used = [];
    if (route) { route.levels.forEach(function (l) { if (used.indexOf(l) === -1) { used.push(l); } }); }
    if (used.length > 1) {
      bar.appendChild(h('span', { 'class': 'lbl', text: 'Route uses' }));
      used.forEach(function (l, i) {
        if (i) { bar.appendChild(h('span', { 'class': 'arrow', text: '→' })); }
        var b = h('button', { type: 'button', 'aria-pressed': l === curLevel ? 'true' : 'false', text: levelName(l) });
        b.addEventListener('click', function () { goLevel(l); });
        bar.appendChild(b);
      });
    }
    var L = levelById(curLevel);
    if (L && L.blank) {
      bar.appendChild(h('div', { 'class': 'blanknote' }, [
        h('span', { 'class': 'long', text: L.note || (L.name + ' is a placeholder.') }),
        h('span', { 'class': 'short', text: L.name + ' is a placeholder floor (guesses only)' })
      ]));
    }
    bar.style.display = bar.childNodes.length ? '' : 'none';
  }

  // ---------- Your location (blue dot) ----------
  // The phone gives latitude and longitude. geo (fitted from GEO.points in data.js) turns that into a
  // spot on the plan. GPS only knows where you are on the ground, not which floor, so the dot shows on
  // Level 1 only for now. Nothing is stored or sent anywhere: the position stays in this page.
  function metersPerUnit() { return geo ? 1 / geo.unitsPerMeter : SCALE.feetPerUnit * 0.3048; }
  function planBounds() {
    var pts = [];
    OUTLINES.forEach(function (o) { if (lv(o) === '1') { pts = pts.concat(o.points); } });
    return boxOf(pts);
  }
  function feetText(m) {
    var ft = m * 3.28084;
    if (ft >= 1000) { return (ft / 5280).toFixed(1) + ' mi'; }
    return (ft < 50 ? Math.max(5, Math.round(ft / 5) * 5) : Math.round(ft / 10) * 10) + ' ft';
  }

  function drawYou() {
    layerYou.textContent = '';
    if (!you || !you.inside || you.level !== curLevel) { return; }
    var g = el('g', { transform: 'translate(' + you.x + ' ' + you.y + ')' }, layerYou);
    el('circle', { 'class': 'you-acc', cx: 0, cy: 0, r: Math.min(you.radius, 600) }, g);
    var mk = el('g', { 'class': 'mk' }, g);
    el('circle', { 'class': 'you-ring', cx: 0, cy: 0, r: 9 }, mk);
    el('circle', { 'class': 'you-dot', cx: 0, cy: 0, r: 7.5 }, mk);
  }

  function setLocBtn() { $('locate').setAttribute('aria-pressed', locOn ? 'true' : 'false'); }

  function renderLoc() {
    var bar = $('locbar');
    bar.textContent = '';
    bar.className = 'locbar';
    var text = '', actions = [];
    if (locNote) {
      text = locNote.text;
      if (locNote.kind === 'warn') { bar.className = 'locbar warn'; }
    } else if (you) {
      var near = you.nearest && you.nearest.meters <= 250 ? you.nearest : null;
      text = you.inside ? 'You are on the plan' + (SIM ? ' (test location).' : ', within about ' + feetText(you.accuracyMeters) + '.')
                        : 'You are about ' + feetText(you.offMapMeters) + ' from Stokes Hall.';
      if (near) {
        text += ' Nearest entrance: ' + near.name + ' (' + feetText(near.meters) + ').';
        if (from !== near.id) {
          var use = h('button', { 'class': 'btn', type: 'button', text: 'Start there' });
          use.addEventListener('click', function () { setFrom(near.id); });
          actions.push(use);
        }
      }
    } else { bar.hidden = true; return; }
    bar.hidden = false;
    bar.appendChild(h('span', { 'class': 'msg', text: text }));
    actions.forEach(function (a) { bar.appendChild(a); });
    if (locOn || you) {
      var stop = h('button', { 'class': 'btn', type: 'button', text: 'Hide' });
      stop.addEventListener('click', function () { stopLocate(true); });
      bar.appendChild(stop);
    }
  }

  function setYou(pos) {
    you = ML.describeFix(pos, { metersPerUnit: metersPerUnit(), bounds: planBounds(), entrances: ENTRANCES });
    you.level = '1';
    locNote = null;
    drawYou(); renderLoc();
    // First good fix: show the dot (not every fix, or the map would fight your fingers).
    if (you.inside && !centered && !SIM) {
      centered = true;
      if (curLevel !== '1') { showLevel('1'); }
      goTo({ cx: you.x, cy: you.y, w: 900 }, true);
    }
  }

  function onFix(p) {
    var c = p.coords, m = geo.toMap(c.latitude, c.longitude);
    // Treat a missing accuracy as poor, and never trust a reading to be better than 3 m.
    var accU = Math.max(c.accuracy || 25, 3) * geo.unitsPerMeter;
    var s = smoother.update(m.x, m.y, accU, p.timestamp || Date.now());
    setYou({ x: s.x, y: s.y, accuracy: s.acc / geo.unitsPerMeter });
  }

  function onLocError(err) {
    var text = 'Your location is not available right now.';
    if (err.code === 1) {
      text = window.isSecureContext === false
        ? 'Location only works on secure (https) pages. Open the map from an https link.'
        : 'Location is blocked for this page. Allow it in your browser settings, then try again.';
      stopLocate(false);
    } else if (err.code === 3) { text = 'Still looking for a GPS signal. It is faster outside.'; }
    locNote = { kind: 'warn', text: text };
    renderLoc();
  }

  function stopLocate(clear) {
    if (watchId != null && navigator.geolocation) { navigator.geolocation.clearWatch(watchId); }
    watchId = null; locOn = false;
    if (clear) { you = null; locNote = null; if (smoother) { smoother.reset(); } }
    setLocBtn(); drawYou(); renderLoc();
  }

  function toggleLocate() {
    if (locOn) { stopLocate(!SIM); return; }
    if (SIM) {
      locOn = true; setLocBtn();
      locNote = you ? null : { kind: 'info', text: 'Test mode: tap the map to place a pretend location.' };
      renderLoc();
      return;
    }
    if (!geo) {
      locNote = { kind: 'warn', text: 'The map is not tied to real GPS positions yet, so it cannot place a blue dot. Add control points to GEO in data.js (see HANDOFF.md). To try the dot now, open this page with ?sim=1 on the end of the link.' };
      renderLoc();
      return;
    }
    if (!navigator.geolocation) {
      locNote = { kind: 'warn', text: 'This browser cannot share a location.' };
      renderLoc();
      return;
    }
    locOn = true; centered = false; you = null;
    smoother = ML.createSmoother({ speed: 1.4 * geo.unitsPerMeter }); // walking pace, in map units per second
    locNote = { kind: 'info', text: 'Finding your location...' };
    setLocBtn(); renderLoc();
    watchId = navigator.geolocation.watchPosition(onFix, onLocError, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
  }

  // ---------- Search ----------
  function search(q) { return ML.search(q, ROOMS, SPOTS); }

  function renderResults() {
    var box = $('results');
    box.textContent = '';
    shown = [];
    if (query.trim() === '') { return; }
    var res = search(query);
    if (!res.length) {
      box.appendChild(h('div', { 'class': 'noneline', text: 'No match. Try a room number, a name, or words like stairs or restrooms.' }));
      return;
    }
    shown = res.slice(0, 6);
    shown.forEach(function (m, i) {
      var sw = m.kind === 'room' ? swatch(m.o.type) : h('span', { 'class': 'sw' });
      if (m.kind !== 'room') { sw.style.background = 'var(--accent-soft)'; }
      var b = h('button', { 'class': 'res' + (i === active ? ' active' : ''), type: 'button', role: 'option' }, [
        sw,
        h('span', { 'class': 't' }, [h('b', { text: titleOf(m) }), h('small', { text: (lv(m.o) !== LEVELS[0].id ? levelName(lv(m.o)) + ' · ' : '') + (m.kind === 'room' ? (TYPES[m.o.type] === 'Stairs, elevators, restrooms' ? 'Building core' : TYPES[m.o.type]) + ' · ' + m.o.wing + (m.o.wing === 'Connector' ? '' : ' wing') : '360 photo point') })]),
        h('kbd', { text: 'Enter' })
      ]);
      b.addEventListener('click', function () { choose(m); });
      b.addEventListener('mousemove', function () { if (active !== i) { active = i; markActive(); } });
      box.appendChild(b);
    });
    if (res.length > 6) { box.appendChild(h('div', { 'class': 'noneline', text: (res.length - 6) + ' more. Type more words to narrow it down.' })); }
  }
  function markActive() {
    var rows = $('results').querySelectorAll('.res');
    for (var i = 0; i < rows.length; i++) { rows[i].classList.toggle('active', i === active); }
  }

  function refreshStyles() {
    var matchIds = {};
    if (query.trim() !== '') { search(query).forEach(function (m) { if (m.kind === 'room') { matchIds[m.o.id] = true; } }); }
    var searching = query.trim() !== '';
    ROOMS.forEach(function (r) {
      var isSel = !!sel && sel.kind === 'room' && sel.o.id === r.id;
      var g = roomEls[r.id];
      g.classList.toggle('dim', hidden[r.type] === true);
      g.classList.toggle('fade', searching ? !matchIds[r.id] : (!!sel && !isSel));

      g.classList.toggle('sel', isSel);
    });
    SPOTS.forEach(function (s) { spotEls[s.id].classList.toggle('sel', !!sel && sel.kind === 'spot' && sel.o.id === s.id); });
    ENTRANCES.forEach(function (en) { entrEls[en.id].classList.toggle('on', en.id === from); });
    $('fromfield').classList.toggle('need', !!sel && !from);
  }

  // ---------- Cards ----------

    ]);

    if (route.usesGuess) { badges.appendChild(h('span', { 'class': 'badge warn', text: 'Includes unchecked hallway' })); }

    var ol = h('ol', { 'class': 'steps' });

      var ic = s.kind === 'start' ? 'start' : (s.kind === 'arrive' ? 'arrive' : name);

        show = h('button', { 'class': 'golevel', type: 'button', text: 'Show ' + levelName(s.level) });
        show.addEventListener('click', (function (l) { return function () { goLevel(l); }; })(s.level));
      }
      ol.appendChild(h('li', { 'class': 'step ' + s.kind }, [
        icon(ic),
        h('span', { 'class': 'txt' }, [s.text, s.outdoor ? h('span', { 'class': 'tag', text: 'Outside' }) : null, show]),

      ]));
    });

    var acts = h('div', { 'class': 'actions' });

    copy.addEventListener('click', function () { copyLink(copy); });

    }

    notes.push('Door positions and some hallways are traced from a brochure and not checked on site yet' + (route.usesGuess ? ', including parts of this route (orange dashes under "Show path network").' : '.'));
    box.appendChild(h('p', { 'class': 'fine', text: notes.join(' ') }));
  }

  function copyLink(btn) {
    var done = function () { var old = btn.lastChild.textContent; btn.lastChild.textContent = 'Copied'; setTimeout(function () { btn.lastChild.textContent = old; }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(location.href).then(done, function () { window.prompt('Copy this link:', location.href); }); }
    else { window.prompt('Copy this link:', location.href); }
  }

  function row(dl, label, value, empty) {
    dl.appendChild(h('dt', { text: label }));
    dl.appendChild(h('dd', value ? { text: value } : { 'class': 'none', text: empty }));
  }

  function renderDetail() {
    var box = $('detail');
    box.textContent = '';
    if (!sel) {
      box.appendChild(h('h3', { text: 'Details' }));
      box.appendChild(h('p', { 'class': 'fine', style: 'margin:0', text: 'Select a room to see its details here.' }));
      return;
    }
    var dl = h('dl');
    if (sel.kind === 'room') {
      var r = sel.o;
      box.appendChild(h('div', { 'class': 'dhead' }, [swatch(r.type, 'sw'), h('div', {}, [h('h2', { text: roomTitle(r) }), h('small', { text: (r.type === 'core' ? 'Building core' : TYPES[r.type]) + ' · ' + r.wing + (r.wing === 'Connector' ? '' : ' wing') + ' · ' + levelName(lv(r)) })])]));
      row(dl, 'Door number', r.door, 'Not added yet');

      box.appendChild(h('div', { 'class': 'dhead' }, [sw, h('div', {}, [h('h2', { text: s.label }), h('small', { text: '360 photo point' })])]));
      dl.appendChild(h('dt', { text: 'Status' }));
      dl.appendChild(h('dd', {}, [statusBadge(s.verified)]));
    }
    box.appendChild(dl);
  }

  function renderPhoto() {
    var box = $('photo');
    box.textContent = '';
    box.appendChild(h('h3', { text: 'Photo' }));
    if (!sel || !sel.o.photo) {
      box.appendChild(h('div', { 'class': 'ph', text: sel ? 'No photo yet. Add a file name in data.js to show one here.' : 'Select a room or a 360 marker to see its photo.' }));
      return;
    }
    var file = sel.o.photo;
    var msg = h('div', { 'class': 'ph', text: 'Loading photo' });
    var img = h('img', { alt: 'Photo of ' + titleOf(sel) });
    img.onerror = function () { img.remove(); msg.textContent = 'Photo file not found: ' + file; };
    img.onload = function () { msg.remove(); };
    img.src = file;
    box.appendChild(msg); box.appendChild(img);
  }

  function renderFoot() {
    var box = $('foot');
    var cls = ROOMS.filter(function (r) { return r.type === 'classroom'; });
    var done = cls.filter(function (r) { return r.door; }).length;
    var photos = SPOTS.filter(function (s) { return s.photo; }).length;
    function bar(label, n, total) {
      var i = h('i'); i.style.width = (total ? Math.round(100 * n / total) : 0) + '%';
      return h('div', {}, [h('div', { 'class': 'row' }, [h('span', { text: label }), h('span', { text: n + ' of ' + total })]), h('div', { 'class': 'meter' }, [i])]);
    }
    box.textContent = '';
    box.appendChild(h('h3', { text: 'Data progress', style: 'margin-top:6px' }));
    box.appendChild(bar('Classrooms with door numbers', done, cls.length));
    box.appendChild(bar('Photo points with photos', photos, SPOTS.length));
    box.appendChild(h('p', { style: 'margin:0', text: B.note }));
  }

  // ---------- State changes ----------
  function findRoute() {
    route = null; dirs = null;
    if (!sel || !from) { return; }
    route = ML.routeTo(graph, from, sel, { accessible: accessible });
    if (route) { dirs = ML.describe(graph, route, titleOf(sel), { feetPerUnit: SCALE.feetPerUnit, levelNames: LEVEL_NAMES }); }
  }

  function update(reframe) {
    findRoute();
    if (reframe) {
      // Show the floor where the route starts, else the chosen room's floor, else the entrance's.
      var target = route ? route.levels[0] : (sel ? lv(sel.o) : (from ? lv(entranceById(from)) : curLevel));
      showLevel(target);
    } else { drawRoute(); renderBanner(); }
    renderRouteCard(); renderDetail(); renderPhoto(); renderLoc();
    refreshStyles(); renderResults();
    saveUrl();
    if (reframe) { frame(); }
  }

  function choose(m, quick) {
    sel = m; query = ''; active = -1; viaQuick = quick || '';
    input.value = titleOf(m);
    update(true);
    input.blur();
  }

  function setFrom(id) {
    from = entranceById(id) ? id : '';
    $('from').value = from;
    try { localStorage.setItem('stokes-from', from); } catch (e) { /* storage blocked: fine */ }
    update(true);
  }

  // Quick "nearest" buttons. With an entrance chosen, jump straight to the closest match.
  function quick(term, name) {
    var targets = search(term).filter(function (m) { return m.kind === 'room'; });
    if (!targets.length) { return; }
    if (from) {
      var best = ML.nearest(graph, from, targets, { accessible: accessible });
      if (best) { choose(best.target, name.toLowerCase()); return; }
    }
    query = term; input.value = term; active = 0;
    update(false); input.focus();
  }

  function saveUrl() {
    if (!window.history || !history.replaceState) { return; }
    var p = [];
    if (from) { p.push('from=' + encodeURIComponent(from)); }
    if (sel) { p.push((sel.kind === 'room' ? 'room=' : 'spot=') + encodeURIComponent(sel.o.id)); }
    if (accessible) { p.push('accessible=1'); }
    try { history.replaceState(null, '', location.pathname + (p.length ? '?' + p.join('&') : '')); } catch (e) { /* some browsers block this on file:// */ }
  }
  function readUrl() {
    var p = {};
    location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i > 0) { p[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); }
    });
    return p;
  }

  // ---------- Controls ----------
  function build() {
    ENTRANCES.forEach(function (en) { $('from').appendChild(h('option', { value: en.id, text: en.name })); });
    $('from').addEventListener('change', function () { setFrom($('from').value); });
    $('accessible').addEventListener('change', function () { accessible = $('accessible').checked; update(true); });
    $('shownet').addEventListener('change', function () {
      drawNetwork();
      $('netkey').classList.toggle('on', $('shownet').checked);
    });

    LEVELS.slice().reverse().forEach(function (L) {
      var b = h('button', { type: 'button', 'data-level': L.id, 'aria-label': L.name, title: L.name, text: L.id });
      b.addEventListener('click', function () { goLevel(L.id); });
      $('floors').appendChild(b);
    });

    QUICK.forEach(function (q) {
      var b = h('button', { 'class': 'chip', type: 'button', text: q[0] });
      b.addEventListener('click', function () { quick(q[1], q[0]); });
      $('quick').appendChild(b);
    });

    var lg = $('legend');
    LEGEND.forEach(function (t) {
      var b = h('button', { type: 'button', 'aria-pressed': 'true' }, [swatch(t), TYPES[t]]);
      b.addEventListener('click', function () {
        hidden[t] = !hidden[t];
        b.setAttribute('aria-pressed', hidden[t] ? 'false' : 'true');
        refreshStyles();
      });
      lg.appendChild(b);
    });

    input.addEventListener('input', function () {
      query = input.value; active = query.trim() ? 0 : -1;
      if (query.trim() === '' && sel) { sel = null; viaQuick = ''; update(false); return; }
      refreshStyles(); renderResults();
    });
    input.addEventListener('focus', function () { input.select(); });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && shown.length) { e.preventDefault(); active = (active + 1) % shown.length; markActive(); }
      else if (e.key === 'ArrowUp' && shown.length) { e.preventDefault(); active = (active - 1 + shown.length) % shown.length; markActive(); }
      else if (e.key === 'Enter') { if (shown.length) { choose(shown[active >= 0 ? active : 0]); } }
      else if (e.key === 'Escape') { query = ''; input.value = sel ? titleOf(sel) : ''; update(false); input.blur(); }
    });

    $('locate').addEventListener('click', toggleLocate);
    if (SIM) { $('locate').title = 'Test mode: place a pretend location'; }
    $('zin').addEventListener('click', function () { zoomBy(0.7); });
    $('zout').addEventListener('click', function () { zoomBy(1.4); });
    $('zreset').addEventListener('click', function () { showAll(true); });

    $('theme').addEventListener('click', function () {
      var cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      setTheme(cur === 'dark' ? 'light' : 'dark', true);
    });
  }

  function setTheme(t, save) {
    document.documentElement.setAttribute('data-theme', t);
    fillIcon('themeico', t === 'dark' ? 'sun' : 'moon');
    if (save) { try { localStorage.setItem('stokes-theme', t); } catch (e) { /* fine */ } }
  }

  // ---------- Pointer: drag to pan, pinch to zoom, tap to select ----------
  var ptrs = {}, drag = null, pinch = null;
  function count() { return Object.keys(ptrs).length; }
  function mid() { var k = Object.keys(ptrs).map(function (i) { return ptrs[i]; }); return { x: (k[0].x + k[1].x) / 2, y: (k[0].y + k[1].y) / 2, d: Math.hypot(k[0].x - k[1].x, k[0].y - k[1].y) }; }
  svg.addEventListener('pointerdown', function (e) {
    cancelAnimationFrame(anim);
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (count() === 1) { moved = false; drag = { x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy }; }
    else if (count() === 2) { var m = mid(); pinch = { d: m.d, w: view.w, at: toWorld(m.x, m.y) }; drag = null; moved = true; }
  });
  svg.addEventListener('pointermove', function (e) {
    if (!ptrs[e.pointerId]) { return; }
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (pinch && count() === 2) {
      var m = mid(), r = svg.getBoundingClientRect();
      var w = Math.max(300, Math.min(allW() * 1.05, pinch.w * pinch.d / Math.max(m.d, 1)));
      view = clampView({
        w: w,
        cx: pinch.at.x - ((m.x - r.left) / r.width - 0.5) * w,
        cy: pinch.at.y - ((m.y - r.top) / r.height - 0.5) * w * ratio()
      });
      applyView();
    } else if (drag) {
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 6) { moved = true; }
      if (moved) {
        var s = view.w / svg.clientWidth;
        view = clampView({ cx: drag.cx - dx * s, cy: drag.cy - dy * s, w: view.w });
        applyView();
      }
    }
  });
  function lift(e) {
    delete ptrs[e.pointerId];
    pinch = null;
    if (count() === 1) { var k = ptrs[Object.keys(ptrs)[0]]; drag = { x: k.x, y: k.y, cx: view.cx, cy: view.cy }; } else { drag = null; }
  }
  window.addEventListener('pointerup', lift);
  window.addEventListener('pointercancel', lift);
  svg.addEventListener('wheel', function (e) {
    e.preventDefault();
    var p = toWorld(e.clientX, e.clientY);
    zoomBy(e.deltaY < 0 ? 0.87 : 1.15, p.x, p.y);
  }, { passive: false });

  function pick(target) {
    var g = target.closest ? target.closest('[data-id],[data-spot],[data-entr]') : null;
    if (!g) { return null; }
    if (g.getAttribute('data-entr')) { return { kind: 'entrance', id: g.getAttribute('data-entr') }; }
    if (g.getAttribute('data-id')) {
      var id = g.getAttribute('data-id');
      for (var i = 0; i < ROOMS.length; i++) { if (ROOMS[i].id === id) { return { kind: 'room', o: ROOMS[i] }; } }
    } else {
      var sid = g.getAttribute('data-spot');
      for (var j = 0; j < SPOTS.length; j++) { if (SPOTS[j].id === sid) { return { kind: 'spot', o: SPOTS[j] }; } }
    }
    return null;
  }
  // Tapping a green marker picks that entrance. Tapping a room or photo point selects it.
  function act(m) { if (m.kind === 'entrance') { setFrom(m.id); } else { choose(m); } }
  svg.addEventListener('click', function (e) {
    if (moved) { moved = false; return; }
    // Test mode: while the locate button is on, a tap places the pretend location instead of selecting.
    if (SIM && locOn) { var w = toWorld(e.clientX, e.clientY); setYou({ x: w.x, y: w.y, accuracy: 8 }); return; }
    var m = pick(e.target);
    if (m) { act(m); }
  });
  svg.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { var m = pick(e.target); if (m) { e.preventDefault(); act(m); } }
  });

  if (window.ResizeObserver) { new ResizeObserver(function () { applyView(); }).observe(svg); }
  else { window.addEventListener('resize', applyView); }

  // ---------- Start ----------
  draw();
  build();
  renderFoot();

  var start = readUrl(), saved = '', savedTheme = '';
  try { saved = localStorage.getItem('stokes-from') || ''; savedTheme = localStorage.getItem('stokes-theme') || ''; } catch (e) { /* storage blocked: fine */ }
  setTheme(savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'), false);
  from = entranceById(start.from) ? start.from : (entranceById(saved) ? saved : '');
  $('from').value = from;
  accessible = start.accessible === '1';
  $('accessible').checked = accessible;
  ROOMS.forEach(function (r) { if (r.id === start.room) { sel = { kind: 'room', o: r }; } });
  SPOTS.forEach(function (s) { if (s.id === start.spot) { sel = { kind: 'spot', o: s }; } });
  if (sel) { input.value = titleOf(sel); }
  showAll(false);
  showLevel(curLevel);
  update(!!sel);
})();
</script>
</body>
</html>
